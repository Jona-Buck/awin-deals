name: Resolve Missing Product Images

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/resolve-missing-images.mjs"

permissions:
  contents: write

concurrency:
  group: resolve-product-images
  cancel-in-progress: false

jobs:
  resolve-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offizielle Produktbilder ergänzen
        run: node scripts/resolve-missing-images.mjs

      - name: Änderungen prüfen
        id: changes
        run: |
          if git diff --quiet -- products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Produktbilder committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "JB Deals Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Add missing official product images"
          git push

      - name: Keine Änderungen
        if: steps.changes.outputs.changed == 'false'
        run: echo "Keine fehlenden offiziellen Produktbilder gefunden."
