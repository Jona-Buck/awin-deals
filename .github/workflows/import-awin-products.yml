name: Import Awin Products

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/import-awin.mjs"
      - "scripts/awin-stream.mjs"
      - ".github/workflows/import-awin-products.yml"
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: awin-product-import-v2
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Produkte aus Awin importieren
        env:
          AWIN_FEED_LIST_URLS: ${{ secrets.AWIN_FEED_LIST_URLS }}
          # Direkte Feed-URLs bleiben als Fallback unterstützt.
          AWIN_PRODUCT_FEED_URLS: ${{ secrets.AWIN_PRODUCT_FEED_URLS }}
          AWIN_MAX_PRODUCTS: "1000"
          AWIN_MIN_DISCOUNT: "0"
          # Reichelt ist auf dem Publisher-Konto bereits beigetreten (AID 14954).
          # Der Importer nutzt dies nur als Fallback, wenn die Feed-Liste den
          # Membership-Status für diesen Feed nicht sauber liefert.
          AWIN_JOINED_ADVERTISER_IDS: "14954"
          NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"
        run: node scripts/import-awin.mjs

      - name: Änderungen prüfen
        id: changes
        run: |
          if git diff --quiet -- products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "JB Deals Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Update Awin product catalogue"
          git push

      - name: Keine Änderungen
        if: steps.changes.outputs.changed == 'false'
        run: echo "Produktkatalog ist bereits aktuell."
