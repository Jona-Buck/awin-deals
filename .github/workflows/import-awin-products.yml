name: Import Awin Products

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awin-product-import-v2
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Status
        run: |
          echo "Der automatische Awin-Feedimport ist deaktiviert."
          echo "Der Produktkatalog wird manuell kuratiert."

      - name: Änderungen prüfen
        id: changes
        run: |
          if git diff --quiet -- products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "JB Deals Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Update manually curated product catalogue"
          git push

      - name: Keine Änderungen
        if: steps.changes.outputs.changed == 'false'
        run: echo "Produktkatalog ist bereits aktuell."
